[package]
name = "ilesta"
version = "1.5.1"
edition = "2024"
description = "De novo genome assembly for long reads using an overlap graph"
license = "GPL-3.0-only"
repository = "https://github.com/yvlaere/Ilesta"
readme = "README.md"
rust-version = "1.85.0"
keywords = ["bioinformatics", "genomics", "genome-assembly", "long-reads"]
categories = ["command-line-utilities"]

[[bin]]
name = "Ilesta"
path = "src/main.rs"

[profile.dev]

[profile.release]
codegen-units = 1
lto = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1.10"
